<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <title>myGraphDrawer</title>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8cff"/>
      <stop offset="1" stop-color="#0a4a9c"/>
    </linearGradient>
  </defs>

  <!-- Fundo arredondado -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#fundo)"/>

  <!-- Arestas dos dois triângulos -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 88 L50 168 L92 128 Z"/>
    <path d="M206 88 L206 168 L164 128 Z"/>
  </g>

  <!-- Ponte: a aresta que liga os dois triângulos -->
  <line x1="92" y1="128" x2="164" y2="128" stroke="#ffc233" stroke-width="10" stroke-linecap="round"/>

  <!-- Vértices -->
  <g fill="#ffffff">
    <circle cx="50" cy="88" r="17"/>
    <circle cx="50" cy="168" r="17"/>
    <circle cx="206" cy="88" r="17"/>
    <circle cx="206" cy="168" r="17"/>
  </g>
  <g fill="#ffc233">
    <circle cx="92" cy="128" r="17"/>
    <circle cx="164" cy="128" r="17"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
